[project]
name = "midi2reaper"
version = "0.1.0"
description = "Match soundfonts to multi-track MIDI and emit REAPER projects driven by the SFLT SoundFont player"
requires-python = ">=3.11"
dependencies = ["mido>=1.3"]

[project.scripts]
midi2reaper = "midi2reaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi2reaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
